<!DOCTYPE html>
<html>
<head>
<title>Beam on Elastic Foundation</title>
<style>
canvas {
	position:absolute;
	top:0;
	left:0;
}
.top-row {
	display: flex;
	align-items: flex-start;
	gap: 40px;
}
table td:first-child {
	padding-right: 28px;
}
td.var {
	font-family: monospace;
	text-align: right;
	padding-right: 6px;
}
.plot-row {
	display: flex;
	align-items: flex-start;
	gap: 10px;
	margin-top: 4px;
}
.btn-row {
	display: flex;
	flex-direction: column;
	gap: 8px;
	width: 130px;
	height: 402px; /* matches the plot canvas (400px + 1px borders) */
}
.btn-row button {
	flex: 1;
	font-size: 16px;
	border: 1px solid #999;
	border-radius: 4px;
	background: #e9e9ee;
	color: #333;
	cursor: pointer;
}
.btn-row button:hover {
	background: #dcdce4;
}
.btn-row button.active {
	background: #46faee;
	border-color: #1fb3a9;
	color: #000;
	font-weight: bold;
	box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2);
}
.btn-row button.active:hover {
	background: #36dcd1;
}
#computed {
	font-family: monospace;
	color: #444;
	font-size: 13px;
	line-height: 1.5;
	border-left: 3px solid #bbb;
	padding-left: 12px;
}
.c-container {
	position: relative;
	height: 400px;
	width: 600px;
	border:1px solid black;
}
.c2-container {
	position: relative;
	height: 150px;
	width: 600px;
	border:1px solid #aaa;
	margin-bottom: 4px;
}
</style>
</head>
<body onload="init()" bgcolor="#f8f8fa">
<div class="top-row">
<table>
<tr><td>Beam Length </td><td class="var">L =</td><td><input type="text" value="384" id="input-L"> in</td></tr>
<tr><td>Point of load application </td><td class="var">a =</td><td><input type="text" value="12" id="input-a"> in</td></tr>
<tr><td>Magnitude of each point load </td><td class="var">Pa =</td><td><input type="text" value="27.56" id="input-Pa"> kip</td></tr>
<tr><td>Subgrade Modulus </td><td class="var">ms =</td><td><input type="text" value="0.1" id="input-ms"> kip/in<sup>3</sup></td></tr>
<tr><td>Beam Depth</td><td class="var">t =</td><td><input type="text" value="12" id="input-t"> in</td></tr>
<tr><td>Beam Width</td><td class="var">b =</td><td><input type="text" value="12" id="input-b"> in</td></tr>
<tr><td>Elastic Modulus</td><td class="var">E =</td><td><input type="text" value="3655" id="input-E"> ksi</td></tr>
<tr><td>Input Forces</td><td colspan="2"><textarea id="forces" rows="3" cols="30" onchange="updateValues()">[[a, Pa], [L-a, Pa]]</textarea></td></tr>
</table>
<div id="computed"></div>
</div>
<div class="c2-container">
<canvas height="150" width="600" id="c2"></canvas>
</div>
<div class="plot-row">
<div class="c-container">
<canvas height="400" width="600" id="c0"></canvas>
<canvas height="400" width="600" id="c1" onclick="draw()"></canvas>
</div>
<div class="btn-row" id="btn-row">
<button onclick="draw(0)"> Deflection </button>
<button onclick="draw(1)"> Angle </button>
<button onclick="draw(2)"> Moment </button>
<button onclick="draw(3)"> Shear </button>
</div>
</div>
<script>
/*
 This program analyzes a beam on an elastic foundation according to the theory described in 
 Beams On Elastic Foundation Theory with Applications in the Fields of Civil and Mechanical 
 Engineering by M. Hetenyi. (Fourth Printing, 1955)

 Loads are given in the "Input Forces" box as a JS array. Each entry is either:
   [x, P]        a point load P (kip, + is downward) applied at x (in)
   [x1, x2, w]   a uniformly distributed load of intensity w (kip/in, + is downward) from x1 to x2 (in)
*/

let can,ctx,can1,ctx1,can2,ctx2;

// units: kips, inches
let ms = 0.1; //"subgrade modulus, kip/in3"
let b = 12; // "beam width, should be 12 in"
let t = 12; // "beam thickness"
let L = 384; // "beam length"
let a = 12; // "point of application of forces"
let Pa = 1; // "magnitude of each applied force, (+) is downward"
let E = 3655; // "Elastic modulus"
let N = 600; // "number of uniform sample intervals along beam (N+1 samples, x=0..L)"

let k, EI, I, lam, y0, theta0;
let pointF = [];

let overlayEnabled = true;
let drawData = [];
let yFactor = 1;

// last quantity plotted; clicking the plot replays it (defaults to Moment)
let lastEffect = 2;

function init(){
	can=document.getElementById("c0");
	ctx=can.getContext("2d");
	can1=document.getElementById("c1");
	ctx1=can1.getContext("2d");
	can2=document.getElementById("c2");
	ctx2=can2.getContext("2d");
	
	can1.addEventListener("mousemove",mouseOverlay);
	can1.addEventListener("mouseout",function(){ctx1.clearRect(0,0,can1.width,can1.height)});

	updateValues()
}
function mouseOverlay(e){
	ctx1.clearRect(0,0,can1.width,can1.height);
	
	if(overlayEnabled && typeof drawData[0] === "number"){
	// drawData has N+1 uniformly spaced samples (x = 0..L)
	let idx = Math.max(0, Math.min(N, Math.round(e.offsetX*N/can.width)));
	let val = drawData[idx];
	ctx1.strokeStyle="rgba(0,0,0,0.2)";
	
	ctx1.beginPath();
	ctx1.moveTo(e.offsetX, 0);
	ctx1.lineTo(e.offsetX, can1.height);
	ctx1.moveTo(0, e.offsetY);
	ctx1.lineTo(can1.width, e.offsetY);
	ctx1.stroke();

	ctx1.beginPath();
	ctx1.strokeStyle="rgba(255,0,0,0.2)";
	ctx1.moveTo(0, can.height/2+yFactor*val);
	ctx1.lineTo(can1.width, can.height/2+yFactor*val);
	ctx1.fillText((idx*L/N).toFixed(3), e.offsetX, can.height/2+yFactor*val-12); 
	ctx1.fillText(val.toFixed(2), e.offsetX, can.height/2+yFactor*val); 

	ctx1.stroke();
	}
}

function updateValues(){
	L = parseFloat(document.getElementById("input-L").value);
	a = parseFloat(document.getElementById("input-a").value);
	Pa = parseFloat(document.getElementById("input-Pa").value);
	ms = parseFloat(document.getElementById("input-ms").value);
	t = parseFloat(document.getElementById("input-t").value);
	b = parseFloat(document.getElementById("input-b").value);
	E = parseFloat(document.getElementById("input-E").value);
	k = ms * b;
	I = (1/12)*b*t*t*t;
	EI = E * I;
	lam = Math.pow(k/(4*EI),0.25);
	pointF = eval(document.getElementById("forces").value);

	document.getElementById("computed").innerHTML =
		"k = ms&middot;b = " + k.toFixed(4) + " kip/in<sup>2</sup><br>" +
		"I = bt<sup>3</sup>/12 = " + I.toFixed(2) + " in<sup>4</sup><br>" +
		"EI = " + EI.toFixed(0) + " kip-in<sup>2</sup><br>" +
		"&lambda; = " + lam.toFixed(6) + " in<sup>-1</sup><br>" +
		"1/&lambda; = " + (1/lam).toFixed(2) + " in<br>" +
		"2&pi;/&lambda; = " + (2*Math.PI/lam).toFixed(2) + " in<br>" +
		"&lambda;L = " + (lam*L).toFixed(3);

	drawLoadDiagram();
}


function siny(x){return Math.sin(lam*x)}
function cosy(x){return Math.cos(lam*x)}
function Sinhy(x){return Math.sinh(lam*x)}
function Coshy(x){return Math.cosh(lam*x)}

// F functions as defined on page 6 (22 of the pdf) 
function F(kk,x){
	if(x<0){
		return 0;
	}else if(kk === 1){
		return Coshy(x)*cosy(x);
	}else if(kk === 2){
		return 0.5*(Coshy(x)*siny(x) + Sinhy(x)*cosy(x));
	}else if(kk === 3){
		return 0.5*Sinhy(x)*siny(x);
	}else if(kk === 4){
		return 0.25*(Coshy(x)*siny(x) - Sinhy(x)*cosy(x));
	}
}

// modifier functions for applied loads 
// because F(kk,x-a) is zero for x<a we can use these in the generalized equation at any point on the beam 
function P(kk,x){
	let val = 0;
	for(let i=0; i<pointF.length;i++){
		// for point loads, add all forces that are to the left of x
		// loads to the right of x are discarded because F(kk,x-a) was defined to be zero for x<a
		if(pointF[i].length === 2){
			let Aa = pointF[i][0];
			let Pp = pointF[i][1];
			val += Pp*F(kk,x-Aa);
		}else if(pointF[i].length === 3){
			// for uniform loads, use derivative identities to integrate loads to the left of x
			let Aa = pointF[i][0];
			let Bb = pointF[i][1];
			let Ww = pointF[i][2];
			
			if(x>=Aa){
				let minBx = Math.min(Bb, x);
				if(kk === 4){
					val+= -(Ww/(4*lam))*(F(1,x-Aa) - F(1,x-minBx));
				}else{
					val+= (Ww/(lam))*(F(kk+1,x-Aa) - F(kk+1,x-minBx));
				}
			}
		}
	}

	return val;
}

function computeIVs(){
	// solve the linear equation given by the assumption of M(L) = 0, V(L) = 0 for the unknowns y(0) and theta(0)
	// Cramer's Rule
	let Det = k * (F(3,L)*F(3,L) - F(2,L)*F(4,L));
	let Dety = lam * (P(2,L)*F(3,L) - P(1,L)*F(4,L));
	let Detth = lam*lam * (F(3,L)*P(1,L) - F(2,L)*P(2,L));

	y0 = Dety/Det;
	theta0 = Detth/Det;
	
}

// generalized deflection equation (equation 4a) 
function Defl(x){return y0*F(1,x) + (1/lam)*theta0*F(2,x) + (1/(lam*lam*lam*EI))*P(4,x)};
function Angle(x){return theta0*F(1,x) - 4*lam*y0*F(4,x) + (1/(lam*lam*EI))*P(3,x)}; 
function Moment(x){return (k/(lam*lam))*y0*F(3,x) + (k/(lam*lam*lam))*theta0*F(4,x) - (1/lam)*P(2,x)};
function Shear(x){return (k/lam)*y0*F(2,x) + (k/(lam*lam))*theta0*F(3,x) - P(1,x)}; 

// Evaluates func on the uniform grid (x = 0..L, N+1 points) and, separately, at every
// load point / load-segment end, so sharp peaks between grid samples aren't missed.
// (Kept separate from drawData so the plot/hover spacing stays uniform.)
function computeExtrema(func){
	let maxV=-Infinity, maxX=0, minV=Infinity, minX=0;
	function test(x){
		if(x<0 || x>L) return;
		let v = func(x);
		if(v>maxV){maxV=v;maxX=x;}
		if(v<minV){minV=v;minX=x;}
	}
	for(let i=0;i<=N;i++) test(i*L/N);
	for(let i=0;i<pointF.length;i++){
		test(pointF[i][0]);
		if(pointF[i].length === 3) test(pointF[i][1]);
	}
	return {maxV,maxX,minV,minX};
}

// Load diagram. Positive (downward) loads are drawn above the beam pointing down;
// negative loads are drawn below the beam pointing up. Point-load arrow lengths are
// scaled to the largest point load; distributed-load heights to the largest distributed load.
function drawLoadDiagram(){
	if(!ctx2) return;
	let W = can2.width, H = can2.height;
	ctx2.clearRect(0,0,W,H);

	let beamY = 68, beamH = 8;
	let beamTop = beamY, beamBot = beamY + beamH;
	let maxPointLen = 50;  // px, arrow length for the largest point load
	let maxDistH = 36;     // px, band height for the largest distributed load
	let minLen = 6;

	ctx2.fillStyle = "#ccc";
	ctx2.fillRect(0, beamY, W, beamH);
	ctx2.strokeStyle = "#333";
	ctx2.lineWidth = 1;
	ctx2.strokeRect(0, beamY, W, beamH);

	ctx2.font = "11px sans-serif";

	let maxP = 0, maxW = 0;
	for(let i=0;i<pointF.length;i++){
		if(pointF[i].length === 2) maxP = Math.max(maxP, Math.abs(pointF[i][1]));
		else if(pointF[i].length === 3) maxW = Math.max(maxW, Math.abs(pointF[i][2]));
	}

	// arrow from tail to tip, head at the tip; dir = +1 points down, -1 points up
	function arrow(x, yTail, yTip, headSize){
		let dir = yTip > yTail ? 1 : -1;
		ctx2.beginPath();
		ctx2.moveTo(x, yTail);
		ctx2.lineTo(x, yTip - dir*headSize);
		ctx2.stroke();
		ctx2.beginPath();
		ctx2.moveTo(x - headSize*0.6, yTip - dir*headSize);
		ctx2.lineTo(x + headSize*0.6, yTip - dir*headSize);
		ctx2.lineTo(x, yTip);
		ctx2.closePath();
		ctx2.fill();
	}

	// distributed loads (drawn first so point loads sit on top)
	for(let i=0;i<pointF.length;i++){
		if(pointF[i].length !== 3) continue;
		let Aa = pointF[i][0], Bb = pointF[i][1], Ww = pointF[i][2];
		let px1 = Aa/L*W, px2 = Bb/L*W;
		let h = maxW > 0 ? Math.max(minLen, Math.abs(Ww)/maxW*maxDistH) : minLen;
		let down = Ww >= 0;
		let yTip = down ? beamTop - 1 : beamBot + 1;
		let yTail = down ? beamTop - h : beamBot + h;
		let yRect = Math.min(yTail, yTip), hRect = Math.abs(yTip - yTail);

		ctx2.fillStyle = "rgba(52,152,219,0.22)";
		ctx2.fillRect(px1, yRect, px2-px1, hRect);
		ctx2.strokeStyle = "rgba(52,152,219,0.7)";
		ctx2.strokeRect(px1, yRect, px2-px1, hRect);

		ctx2.strokeStyle = "#2471a3";
		ctx2.fillStyle = "#2471a3";
		let nArrows = Math.max(1, Math.round((px2-px1)/40));
		for(let j=0; j<=nArrows; j++){
			let ax = px1 + j*(px2-px1)/nArrows;
			arrow(ax, yTail, yTip, Math.min(6, hRect*0.6));
		}
		ctx2.fillStyle = "#154360";
		ctx2.textAlign = "center";
		ctx2.textBaseline = down ? "bottom" : "top";
		ctx2.fillText("w = "+Ww.toFixed(3)+" k/in", (px1+px2)/2, down ? yTail - 2 : yTail + 2);
	}

	// point loads
	for(let i=0;i<pointF.length;i++){
		if(pointF[i].length !== 2) continue;
		let Aa = pointF[i][0], Pp = pointF[i][1];
		let px = Aa/L*W;
		let len = maxP > 0 ? Math.max(minLen, Math.abs(Pp)/maxP*maxPointLen) : minLen;
		let down = Pp >= 0;
		let yTip = down ? beamTop - 1 : beamBot + 1;
		let yTail = down ? beamTop - len : beamBot + len;
		ctx2.strokeStyle = "#c0392b";
		ctx2.fillStyle = "#c0392b";
		ctx2.lineWidth = 2;
		arrow(px, yTail, yTip, 8);
		ctx2.lineWidth = 1;
		// keep labels inside the canvas near the ends
		ctx2.textAlign = px < 30 ? "left" : (px > W-30 ? "right" : "center");
		ctx2.textBaseline = down ? "bottom" : "top";
		ctx2.fillText(Pp.toFixed(2)+" k", px, down ? yTail - 2 : yTail + 2);
	}

	ctx2.fillStyle = "#333";
	ctx2.textBaseline = "alphabetic";
	ctx2.textAlign = "left";
	ctx2.fillText("x = 0", 2, H-3);
	ctx2.textAlign = "right";
	ctx2.fillText("x = L = "+L+" in", W-2, H-3);
	ctx2.textBaseline = "alphabetic";
}

function draw(effect = lastEffect){
	lastEffect = effect;
	// highlight the button for the quantity currently displayed
	let btns = document.querySelectorAll("#btn-row button");
	for(let i=0;i<btns.length;i++) btns[i].classList.toggle("active", i === effect);
	ctx.clearRect(0,0,can.width, can.height);
	updateValues();
	computeIVs();
	ctx.beginPath();

	let func;
	let quantity, unit;
	if(effect === 3){
		func = Shear;
		quantity = "Shear";
		unit = " kip";
	}else if (effect === 2){
		func = Moment;
		quantity = "Moment";
		unit = " kip-inches";
	}
	else if (effect === 1){ 
		func = Angle;
		quantity = "Angle";
		unit = " radians";
	}
	else{
		func = Defl;
		quantity = "Deflection";
		unit = " inches";
	}
	
	for(let i=0; i<=N; i++){
		drawData[i] = func(i*L/N);
	}
	let ext = computeExtrema(func);
	let dataMax = ext.maxV, dataMin = ext.minV;
	
	let boundFactor = 0.8; // ratio of the full canvas height to use for drawing
	yFactor = (boundFactor * can.height/2)/Math.max(Math.abs(dataMax), Math.abs(dataMin), 1e-12); //ratio for scaling plotted values
	for(let i=0; i<=N; i++){
		ctx.lineTo(i*can.width/N, can.height/2 + yFactor * drawData[i]);
		if(i<N){
			ctx.fillStyle = drawData[i]>0 ? "rgba(217, 237, 142,0.3)" : "rgba(237, 229, 142,0.3)";
			ctx.fillRect(i*can.width/N, can.height / 2, can.width/N, yFactor * drawData[i]);
		}
	}
	ctx.stroke();
	
	ctx.font = "16px Serif";

	// labels are nudged to stay inside the canvas near either end of the beam
	function label(text, px, py){
		let w = ctx.measureText(text).width;
		ctx.fillText(text, Math.max(2, Math.min(px, can.width - w - 2)), py);
	}
	ctx.fillStyle = dataMax > 0 ? "#41a633" : "#d68c2b"
	label(dataMax.toFixed(3)+unit, ext.maxX/L*can.width, can.height/2+yFactor*dataMax + 12);

	ctx.fillStyle = dataMin > 0 ? "#41a633" : "#d68c2b"
	label(dataMin.toFixed(3)+unit, ext.minX/L*can.width, can.height/2+yFactor*dataMin - 12);
 
	let out = document.getElementById("out");
	out.innerHTML = quantity + "<br>" +
		" Max: " +dataMax.toFixed(3) +" " +unit+" at " + ext.maxX.toFixed(2) + " inches<br>"+ 
		" Min: " +dataMin.toFixed(3) +" " +unit+" at " + ext.minX.toFixed(2) + " inches<br>" ;

	// deflection stats are needed for bearing pressure and the uplift check regardless of what is plotted
	let defl = (quantity === "Deflection") ? ext : computeExtrema(Defl);
	if(quantity === "Deflection"){
		//elastic soil assumption is not valid if the allowable bearing pressure is exceeded
		out.innerHTML += "Max Bearing Pressure: " + (defl.maxV*ms*144).toFixed(3) + " ksf";
	}
	// Winkler springs can only push: negative deflection means the beam lifts off the soil
	if(defl.minV < 0){
		out.innerHTML += '<br><span style="color:red;font-weight:bold">&#9888; Uplift: deflection goes negative (min ' +
			defl.minV.toFixed(4) + ' in at x = ' + defl.minX.toFixed(1) +
			' in). Results are not valid as computed.</span>';
	}
}

</script>
<br>
<p id="out"></p>
<br>

</body>
</html>
